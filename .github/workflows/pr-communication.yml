# Immediate PR communication gate (CEO overview, Decision needed,
# Module-boundary decision, Validation). Re-runs on description edits.
#
# Contributor guidance and source-verification limits live in CONTRIBUTING.md.
# Firstmate additionally fails a missing CEO overview or one that is only
# implementation intent (scripts/pr-communication/firstmateCeoOverview.ts).
# Kept separate from CI so body-only edits do not re-run the full matrix.
#
# This repo has no package.json, so Node's built-in type stripping executes the
# assessor without downloading a package from the npm registry.
#
# Use pull_request, not pull_request_target. The introducing PR adds the
# checker; checking out the base branch cannot run it until that lands.
# No private secret is exposed to code from the proposed head.

name: pr-communication

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-communication-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-state:
    name: Determine final PR head
    if: >-
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      run_gate: ${{ steps.head.outputs.run_gate }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Classify PR head
        id: head
        run: |
          set -eu
          subject=$(git log -1 --format=%s)
          case "$subject" in
            no-mistakes\(*)
              printf 'run_gate=false\n' >> "$GITHUB_OUTPUT"
              ;;
            *)
              printf 'run_gate=true\n' >> "$GITHUB_OUTPUT"
              ;;
          esac

  pr-communication:
    name: pr-communication
    needs: pr-state
    if: >-
      needs.pr-state.result == 'success' &&
      needs.pr-state.outputs.run_gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Assess PR communication
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node --experimental-strip-types scripts/check-pr-communication.ts

      - name: Assess Firstmate CEO overview
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node --experimental-strip-types scripts/check-firstmate-ceo-overview.ts
